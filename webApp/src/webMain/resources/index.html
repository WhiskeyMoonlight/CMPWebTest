<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#52B0CD">
    <meta name="robots" content="noindex, nofollow">
    <title>MedEx</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body style="text-align: center; align-content: center">
    <svg id="loader" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#52B0CD" stroke-width="4" fill="none" stroke-linecap="round"
                stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                              repeatCount="indefinite"/>
        </circle>
    </svg>
    <noscript>Для работы MedEx нужен JavaScript.</noscript>
    <script>
        if (typeof WebAssembly === "undefined") {
            document.getElementById("loader").remove();
            document.body.textContent = "Браузер не поддерживает WebAssembly (например, включён режим блокировки на iOS). Откройте MedEx в другом браузере или отключите ограничение.";
        }
    </script>
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
